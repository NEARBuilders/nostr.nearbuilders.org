name: Staging

# Thin wrapper — the shared implementation lives in the base runtime repo
# (NEARBuilders/everything-dev). This repo owns triggers, secret policy, and
# working directory. The @main ref is the reusable-wrapper pointer only: the
# child's framework surface is pinned via `platform` (ADR 0034) and moves
# exclusively through `bos upgrade`.
on:
  # Manual-only until the v2 production flip: live v1 consumers extend this
  # app's published config, so a v2 publish must be deliberate.
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false
      storage_origin:
        description: 'Upload service origin (default: vars.BOS_STORAGE_ORIGIN or the shared service)'
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy Staging
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-staging.yml@v2.0.0-rc.24
    with:
      working_directory: .
      verbose: ${{ inputs.verbose == true }}
      storage_origin: ${{ inputs.storage_origin || vars.BOS_STORAGE_ORIGIN || 'https://upload.everything.dev' }}
    secrets: inherit
